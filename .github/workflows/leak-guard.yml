# Fails the build if a secret or a forbidden internal name (see .gitleaks.toml)
# appears in the files or anywhere in the git history.
name: leak-guard

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  GITLEAKS_VERSION: 8.21.2

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install gitleaks
        run: |
          curl -sSfL -o gitleaks.tgz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          tar -xzf gitleaks.tgz gitleaks
          sudo mv gitleaks /usr/local/bin/
          rm gitleaks.tgz
          gitleaks version

      - name: Scan working tree
        run: gitleaks dir . --config .gitleaks.toml --redact --no-banner --exit-code 1

      - name: Scan full history
        # Every commit on every ref, not only the pushed range: the history was
        # rewritten once and must stay clean end to end.
        run: gitleaks git . --config .gitleaks.toml --redact --no-banner --exit-code 1 --log-opts="--all"
